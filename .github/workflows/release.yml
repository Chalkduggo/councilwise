name: Release

# Push a tag like v1.0.0 and this builds the Windows installer and portable app,
# then attaches them to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer and portable app
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Councilwise ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/Councilwise-Setup-*.exe
            dist/Councilwise-Portable-*.exe
            dist/SHA256SUMS.txt
      - name: Keep build as artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: councilwise-windows
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
